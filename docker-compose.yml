version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: strongpassword123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
      build: .
      command: celery -A Online_learning worker --loglevel=info
      volumes:
        - .:/app
      depends_on:
        - redis
        - db

  celery-beat:
      build: .
      command: celery -A Online_learning beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
      volumes:
        - .:/app
      depends_on:
        - redis
        - db

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=strongpassword123
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
      - SECRET_KEY=your_very_long_secret_key_here_change_it
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/static
      - ./media:/media
    depends_on:
      - web

volumes:
  postgres_data: